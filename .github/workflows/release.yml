name: Windows build and release

on:
  pull_request:
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Check release versions
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $cargo = Get-Content src-tauri/Cargo.toml -Raw
          if ($tauriVersion -ne $version -or $cargo -notmatch ('(?m)^version = "' + [regex]::Escape($version) + '"')) {
            throw 'Version mismatch between package.json, tauri.conf.json and Cargo.toml'
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw 'Tag does not match application version'
          }
      - run: npm ci
      - run: npm test
      - run: pwsh -NoProfile -File tests/chat-sync-hook.test.ps1
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri build -- --bundles nsis
      - name: Prepare installer and checksum
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Path release-assets | Out-Null
          $installers = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe)
          if ($installers.Count -ne 1) { throw 'Expected exactly one NSIS installer' }
          $name = "desktop-sticky-notes_${version}_x64-setup.exe"
          Copy-Item -LiteralPath $installers[0].FullName -Destination "release-assets/$name"
          $hash = (Get-FileHash "release-assets/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content release-assets/SHA256SUMS.txt -Encoding utf8NoBOM
          $changelog = Get-Content CHANGELOG.md -Raw
          $entry = [regex]::Match($changelog, '(?ms)^## ' + [regex]::Escape($version) + ' - .*?(?=^## |\z)')
          if (-not $entry.Success) { throw 'Missing CHANGELOG entry for release' }
          $entry.Value.Trim() | Set-Content release-assets/release-notes.md -Encoding utf8NoBOM
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-installer
          path: release-assets/
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-installer
          path: release-assets
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --notes-file release-assets/release-notes.md
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "桌面便签 $RELEASE_TAG" --notes-file release-assets/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" release-assets/*-setup.exe release-assets/SHA256SUMS.txt --clobber
